[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-show-terminal"
version = "1.3.0"
description = "Python quant backend and React API for the MLB The Show investment terminal."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.1",
  "pydantic>=2.13.4",
  "uvicorn[standard]>=0.46.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "httpx>=0.28.1"
]
deploy = [
  "huggingface_hub>=1.2.3"
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[project.scripts]
mlb-show-terminal = "mlb_show_terminal.cli:main"
