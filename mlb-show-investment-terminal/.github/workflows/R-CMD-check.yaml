name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shiny
            bslib
            bsicons
            shinybusy
            httr2
            jsonlite
            dplyr
            plotly
            reactable
            boot
            sandwich
            probably
            yardstick
            memoise
            cachem
            testthat
            withr
            tibble
      - name: Run testthat suite
        run: |
          Rscript -e 'options(testthat.progress.max_fails = 5); testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
